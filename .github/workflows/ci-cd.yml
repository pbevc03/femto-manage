name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-fm/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-fm
        run: npm ci

      - name: Lint frontend
        working-directory: frontend-fm
        run: npm run lint

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-fm/pom.xml

      - name: Lint backend
        working-directory: backend-fm
        run: ./mvnw --batch-mode validate
  
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-fm/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-fm
        run: npm ci

      - name: Build frontend
        working-directory: frontend-fm
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-fm/pom.xml

      - name: Package backend
        working-directory: backend-fm
        run: ./mvnw --batch-mode package -DskipTests

      - name: Save build outputs
        uses: actions/upload-artifact@v6
        with:
          name: application-build
          path: |
            frontend-fm/dist/
            backend-fm/target/backend-fm-*.jar
          if-no-files-found: error
          retention-days: 7

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-fm/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-fm
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-fm/pom.xml

      - name: Install Playwright browser
        working-directory: frontend-fm
        run: npx playwright install --with-deps msedge

      - name: Run frontend browser tests
        working-directory: frontend-fm
        run: npm run test:e2e:isolated -- --reporter=html

      - name: Run backend tests and create coverage report
        working-directory: backend-fm
        run: ./mvnw --batch-mode verify

      - name: Save backend coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage-report
          path: backend-fm/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Save frontend browser test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-playwright-report
          path: frontend-fm/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  publish-backend-image:
    name: publish-backend-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: application-build
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend-fm/Dockerfile.deploy
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/femto-manage-backend:${{ github.sha }}

  build-vercel-artifact:
    name: build-vercel-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-fm/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@67.0.0

      - name: Pull Vercel production settings
        working-directory: frontend-fm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel deployment artifact
        working-directory: frontend-fm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Save Vercel deployment artifact
        uses: actions/upload-artifact@v6
        with:
          name: vercel-output
          path: frontend-fm/.vercel/output/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test, build-vercel-artifact, publish-backend-image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Vercel deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: vercel-output
          path: frontend-fm/.vercel/output/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@67.0.0

      - name: Deploy backend image on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/${{ github.repository_owner }}/femto-manage-backend:${{ github.sha }}
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "${RENDER_DEPLOY_HOOK_URL}"

      - name: Deploy frontend to Vercel
        working-directory: frontend-fm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"